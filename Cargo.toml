[workspace]
resolver = "2"
members = [
    "crates/up366-core",
    "crates/up366-protocol",
    "crates/up366-store",
    "crates/up366-media",
    "crates/up366-sync",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
# Private workspace: nothing here is published to crates.io, and path-only
# workspace dependencies are therefore not registry wildcards.
publish = false
repository = "https://github.com/not-exist/SuperUp366"

[workspace.dependencies]
up366-core = { path = "crates/up366-core" }
up366-protocol = { path = "crates/up366-protocol" }
up366-store = { path = "crates/up366-store" }
up366-media = { path = "crates/up366-media" }

base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
hmac = "0.13"
httpmock = "0.9"
keyring = "3"
md-5 = "0.10"
percent-encoding = "2"
sha1 = "0.10"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
