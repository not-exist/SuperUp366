[package]
name = "up366-app"
description = "SuperUp366 desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "up366_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Without this feature a build loads `build.devUrl` (the Vite server) instead of
# the embedded `frontendDist`. Enable it for any standalone binary:
#   cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono.workspace = true
dirs = "7"
parking_lot = "0.12"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
up366-core.workspace = true
up366-protocol.workspace = true
up366-store.workspace = true
up366-media.workspace = true

[dev-dependencies]
futures = "0.3"
serial_test = "3"
tokio.workspace = true
tempfile.workspace = true
