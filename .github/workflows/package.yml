name: Package

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Prefix for the artifact name.
        required: false
        type: string
        default: SuperUp366
      upload_artifacts:
        description: Upload the installers as workflow artifacts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
            patterns: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: nsis
            patterns: |
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libsoup-3.0-dev
          # linuxdeploy (used for the AppImage) is itself an AppImage and needs
          # FUSE. The package is libfuse2 on 22.04 and libfuse2t64 on 24.04+.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      # The CLI is invoked through node so the same command works in bash and
      # pwsh; running from the repo root lets it discover src-tauri/.
      - name: Build installers
        run: >-
          node frontend/node_modules/@tauri-apps/cli/tauri.js build
          --bundles ${{ matrix.bundles }}

      - name: Upload installers
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error
          retention-days: 14
