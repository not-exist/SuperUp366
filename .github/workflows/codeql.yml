name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Mondays 04:00 UTC: rescan unchanged code after new queries ship.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Rust workspace and the Tauri shell. `none` means CodeQL reads
          # the sources without compiling, so no webkit2gtk/gtk headers are
          # needed here.
          - language: rust
            build-mode: none
            config-file: ./.github/codeql/codeql-config.yml
          - language: javascript-typescript
            build-mode: none
            config-file: ./.github/codeql/codeql-config.yml
          # Workflow-injection and unpinned-action checks for .github/workflows.
          # Path filters do not apply to this language, so no config file.
          - language: actions
            build-mode: none
            config-file: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ${{ matrix.config-file }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
        if: matrix.language == 'javascript-typescript'
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: matrix.language == 'javascript-typescript'
        run: pnpm --dir frontend install --frozen-lockfile

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
